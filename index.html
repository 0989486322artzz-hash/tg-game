<!DOCTYPE html>
<html lang="uk">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0c">
  <title>Нагодуй Білого</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="bg" class="bg"></div>
    <div class="bg-shade"></div>

    <header class="top">
      <div class="chip" id="where">Білий · Тартак</div>
      <button id="soundBtn" class="icon-btn" aria-label="Звук">🔊</button>
    </header>

    <section class="wallet">
      <div class="balance"><span class="cur">$</span><b id="money">0</b></div>
      <div class="rates">
        <span id="perTap">+1 $ / тап</span>
        <span id="perSec">0 $ / с</span>
      </div>
    </section>

    <section class="goal">
      <div class="goal-text"><span id="goalLabel">Заробити у Тартаку</span><b id="goalNums">0 / 100 $</b></div>
      <div class="bar"><i id="goalBar"></i></div>
    </section>

    <main id="scene" class="scene" aria-label="Тапай, щоб нагодувати">
      <div class="hint" id="hint">Тапай — годуй Білого грошима 💵</div>
    </main>

    <button id="moveBtn" class="move hidden"></button>

    <nav class="nav">
      <button data-sheet="shop"><span class="ic">⚡</span><span>Прокачка</span><i class="dot hidden" id="shopDot"></i></button>
      <button data-sheet="map"><span class="ic">🗺️</span><span>Мапа</span></button>
    </nav>

    <div id="fx" class="fx"></div>

    <div class="sheet" id="shop" aria-hidden="true">
      <div class="sheet-head"><h2>Прокачка</h2><div class="sheet-money">$ <b id="shopMoney">0</b></div><button class="icon-btn close" aria-label="Закрити">✕</button></div>
      <div class="list" id="shopList"></div>
    </div>

    <div class="sheet" id="map" aria-hidden="true">
      <div class="sheet-head"><h2>Мапа</h2><button class="icon-btn close" aria-label="Закрити">✕</button></div>
      <div class="list" id="mapList"></div>
    </div>

    <div class="overlay hidden" id="overlay"><div class="card" id="overlayCard"></div></div>
    <div id="debug" class="debug hidden"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
